
name: Build RinAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix and check manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8")
          content = content.lstrip("\ufeff\r\n\t ")
          path.write_text(content, encoding="utf-8")

          ET.parse(path)
          print("Manifest XML syntax OK")
          PY

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Show Kotlin errors
        if: always()
        run: |
          echo "=== Kotlin compiler errors ==="
          if [ -f build.log ]; then
            grep -n -E 'e: |error:|MainActivity.kt|What went wrong:' build.log || true
          else
            echo "build.log tidak dijumpai"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RinAI-debug-APK
          path: app/build/outputs/apk/debug/*.apk
