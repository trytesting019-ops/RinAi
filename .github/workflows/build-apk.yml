
name: Build RinAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix and check Android manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8-sig")

          start = s.find("<?xml")
          if start < 0:
              start = s.find("<manifest")
          if start < 0:
              raise SystemExit("ERROR: manifest tag not found")

          s = s[start:].lstrip()
          root = ET.fromstring(s)
          if not root.tag.endswith("manifest"):
              raise SystemExit("ERROR: invalid manifest root")

          p.write_text(s.rstrip() + "\n", encoding="utf-8")
          print("Manifest XML fixed and valid")
          PY

      - name: Build APK
        id: build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          result=$?

          echo "===== ERROR SUMMARY ====="
          grep -n -i -B 3 -A 8 -E "What went wrong|FAILURE:|Caused by:|Could not|error:" build.log | tail -n 60 || true

          echo "===== LAST LOG LINES ====="
          tail -n 40 build.log

          exit "$result"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RinAI-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RinAI-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
