
name: Build RinAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8").lstrip("\ufeff\r\n\t ")
          p.write_text(s, encoding="utf-8")
          ET.parse(p)
          print("Manifest XML OK")
          PY

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          set +e
          gradle assembleDebug --stacktrace --info > build.log 2>&1
          result=$?
          echo "===== GRADLE ERROR DETAILS ====="
          grep -n -B 5 -A 15 -E "What went wrong:|Execution failed for task|Could not|error:" build.log || tail -n 100 build.log
          exit $result

      - name: Upload build log
        if: steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: RinAI-build-log
          path: build.log
          if-no-files-found: warn

      - name: Stop if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Find APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RinAI-debug-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
