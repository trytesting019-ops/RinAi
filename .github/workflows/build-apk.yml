
name: Build RinAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8").lstrip("\ufeff\r\n\t ")
          p.write_text(s, encoding="utf-8")
          ET.parse(p)
          print("Manifest XML OK")
          PY

      - name: Build APK and show errors
        id: build_apk
        continue-on-error: true
        run: |
          gradle assembleDebug --stacktrace --info > build.log 2>&1
          result=$?
          echo "===== BUILD ERROR ====="
          grep -n -B 8 -A 20 -E "What went wrong:|Execution failed for task|Could not|error:" build.log || tail -n 120 build.log
          echo "===== END BUILD ERROR ====="
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RinAI-build-log
          path: build.log
          if-no-files-found: warn

      - name: Search for APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RinAI-debug-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn